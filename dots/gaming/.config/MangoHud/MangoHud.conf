### MangoHud : LG G3 120 Hz + VRR. Cap a 117 FPS pour rester dans la plage VRR (48-120)
### sans jamais toucher la limite haute ou le VRR decroche. Doc : https://github.com/flightlessmango/MangoHud
# Premiere valeur = limite par defaut (117) ; Shift_L+F1 cycle 117 -> sans limite -> 60
fps_limit=117,0,60
# early = frametimes les plus reguliers (fluidite), late = latence minimale mais micro-stutter
fps_limit_method=early
toggle_fps_limit=Shift_L+F1

### Affichage (resolution native 4K : police grande)
# HUD cache au lancement : le cap a 117 FPS reste actif. Shift_L+` (touche "grave") l'affiche/le masque.
no_display=1
toggle_hud=Shift_L+grave
# Shift_L+F3 : cycle les presets MangoHUD (1 = FPS seul, 2 = ligne compacte, 3 = etendu, 4 = detaille)
toggle_preset=Shift_L+F3
preset=-1,1,2,3,4
legacy_layout=false
font_size=30
position=top-left
round_corners=8
background_alpha=0.35
toggle_logging=Shift_L+F2

### Contenu (layout personnalise, preset -1)
fps
# FPS moyens + 1 % low a cote du compteur
fps_metrics=avg,0.01
frametime
frame_timing
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
vram
cpu_stats
cpu_temp
cpu_mhz
cpu_power
ram
vulkan_driver
engine_version
wine
resolution
# Indique si le jeu utilise Proton + ntsync/fsync/esync
winesync

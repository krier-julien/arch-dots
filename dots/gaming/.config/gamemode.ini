; gamemode : lance via `gamemoderun %command%` dans Steam (voir docs/30-gaming.md)
[general]
renice=10
softrealtime=auto
ioprio=0
inhibit_screensaver=1
; ne pas toucher au governor : amd-pstate EPP + scx_lavd gerent deja les frequences
desiredgov=

[custom]
; 7950X3D : preferer le CCD avec 3D V-Cache pendant le jeu, revenir en mode frequence apres
start=/usr/local/bin/x3d-mode cache
end=/usr/local/bin/x3d-mode frequency

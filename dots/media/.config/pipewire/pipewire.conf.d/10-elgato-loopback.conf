# Loopback permanent : son de l'Elgato 4K X -> sortie par defaut, pour entendre la console
# en direct sans passer par OBS. Se reconnecte seul quand la carte est (re)branchee.
context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      node.description   = "Elgato 4K X -> sortie"
      node.name          = "elgato_loopback"
      audio.position     = [ FL FR ]
      capture.props = {
        node.name        = "elgato_loopback.capture"
        target.object    = "elgato_4kx_in"   # nom fixe par wireplumber (50-elgato.conf)
        node.passive     = false             # garde le graphe actif : son continu
        stream.dont-remix = true
        node.dont-reconnect = false
      }
      playback.props = {
        node.name        = "elgato_loopback.playback"
        # flux de lecture ordinaire : suit la sortie par defaut, visible dans l'onglet
        # "Lecture" de pwvucontrol sous "Elgato 4K X -> sortie" (volume independant)
        node.dont-reconnect = false
      }
      # latence : ~10 ms a 48 kHz
      node.latency = 512/48000
    }
  }
]

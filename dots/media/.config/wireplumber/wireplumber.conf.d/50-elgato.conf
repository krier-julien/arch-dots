# Elgato 4K X : nom de noeud stable (cible du loopback), jamais suspendu, 48 kHz.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-Elgato.*" } ]
    actions = {
      update-props = {
        node.name        = "elgato_4kx_in"
        node.nick        = "Elgato 4K X"
        node.description = "Elgato 4K X (capture)"
        audio.rate       = 48000
        session.suspend-timeout-seconds = 0
        # ne pas devenir la source par defaut (le micro reste prioritaire)
        priority.session = 100
      }
    }
  }
]

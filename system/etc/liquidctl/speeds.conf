# Vitesses fixes appliquees au boot et apres une reprise de veille par liquidctl-apply.
# Modifier puis : sudo systemctl restart liquidctl-apply
#
# Hub Lian Li Uni SL V2, cablage releve avec `liquidctl status` :
#   fan1 = 3x SL140 facade (intake)          fan3 = 3x SL120 bas, sous le GPU (intake)
#   fan2 = libre (0 rpm : les SL120 du radiateur sont sur le Kraken, pas sur le hub)
#   fan4 = 1x SL140 arriere (exhaust)
LIANLI_FAN1=45
# LIANLI_FAN2=   (vide = canal ignore)
LIANLI_FAN3=45
LIANLI_FAN4=50

# NZXT Kraken 2023 Elite : pompe (20-100 %) et ventilateurs du radiateur (3x SL120, 0-100 %)
# branches sur le header ventilateur du Kraken.
KRAKEN_PUMP=70
KRAKEN_FAN=55
# Ecran LCD : "liquid" (temperature du liquide), "duty", un chemin de gif, ou vide pour ne pas toucher.
# liquidctl libelle ce modele "(broken)" : status/pompe/ventilateurs fonctionnent, l'ecran est best-effort.
KRAKEN_LCD=liquid

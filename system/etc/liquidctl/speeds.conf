# Vitesses fixes appliquees au boot et apres une reprise de veille par liquidctl-apply.
# Modifier puis : sudo systemctl restart liquidctl-apply
#
# Hub Lian Li Uni (SL V2) : 4 canaux. Reperer quel canal pilote quel groupe avec
#   sudo liquidctl --match "Lian Li" set fan1 speed 100   (puis fan2, fan3, fan4)
# Hypothese de cablage a verifier :
#   fan1 = 3x SL140 facade (intake)      fan2 = 3x SL120 bas, sous le GPU (intake)
#   fan3 = 3x SL120 radiateur (exhaust)  fan4 = 1x SL140 arriere (exhaust)
LIANLI_FAN1=45
LIANLI_FAN2=45
LIANLI_FAN3=55
LIANLI_FAN4=50

# NZXT Kraken Elite : pompe fixe (20-100 %). 70 % = silencieuse, marge thermique large sur un 7950X3D.
KRAKEN_PUMP=70
# Ecran LCD : "liquid" (temperature du liquide), "duty" ou un gif : voir docs/50-hardware.md
KRAKEN_LCD=liquid

# Chargement precoce des modules NVIDIA (KMS des le initramfs).
# Suffixe "?" : module optionnel. Le noyau `linux` de secours n'a pas de modules NVIDIA
# (seul linux-cachyos-nvidia-open est installe) : sans le "?", mkinitcpio echoue pour ce noyau.
MODULES+=(nvidia? nvidia_modeset? nvidia_uvm? nvidia_drm?)

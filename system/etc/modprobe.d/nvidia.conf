# NVIDIA open kernel modules (RTX 4090)
# modeset + fbdev : KMS pour Wayland, console framebuffer sur le driver NVIDIA
options nvidia_drm modeset=1 fbdev=1
# PreserveVideoMemoryAllocations : suspend/resume fiable (services nvidia-suspend/resume)
# UsePageAttributeTable : meilleures perfs memoire
# EnableGpuFirmware : GSP, obligatoire avec les modules open
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_UsePageAttributeTable=1 NVreg_EnableGpuFirmware=1

# Genere par scripts/20-hyprland.sh depuis config.env (DOTS_SDDM_THEME). "zz-" pour primer
# sur un eventuel theme.conf ecrit par le script sddm.sh de qylock.
[General]
Numlock=on

[Theme]
Current=@@THEME@@
CursorTheme=Bibata-Modern-Classic
CursorSize=48

[X11]
# Greeter X11 (fiable avec NVIDIA) rendu en HiDPI pour la TV 4K
ServerArguments=-nolisten tcp -dpi 192
